name: PR Quality Gate

on:
  pull_request:
    branches: [main]

concurrency:
  group: pr-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit

  bdd:
    name: BDD tests
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run BDD tests
        run: npm run test:bdd

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  quality-gate:
    name: Quality gate
    needs: [unit, bdd]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Enforce quality gate
        run: |
          echo "Unit tests: ${{ needs.unit.result }}"
          echo "BDD tests:  ${{ needs.bdd.result }}"
          if [ "${{ needs.unit.result }}" != "success" ] || [ "${{ needs.bdd.result }}" != "success" ]; then
            echo "::error::Quality gate failed — unit and BDD must both pass before merge to main."
            exit 1
          fi
          echo "Quality gate passed."
